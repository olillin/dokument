name: Publish .pdfs to Docs
on:
  push:
    branches:
      - master

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build_all.yml

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Get pdfs
        uses: actions/download-artifact@v4
        with:
          path: ./pdfs

      - name: Flatten directory structure and remove empty directories
        run: |
          find ./pdfs -mindepth 2 -type f -print -exec mv {} ./pdfs \;
          find ./pdfs -type d -empty -delete

      - name: Clean all files and folders except .pdfs
        run: |
          find . -not -path "./pdfs/*" -not -name "pdfs" -not -name "." -delete

      - name: Publish stadga
        uses: olillin/publish-docs-action@main
        with:
          path: ./pdfs/stadga.pdf
          category-stub: operational-documents
          document-stub: bylaws

      - name: Publish reglemente
        uses: olillin/publish-docs-action@main
        with:
          path: ./pdfs/reglemente.pdf
          category_stub: operational-documents
          document_stub: bylaws

      - name: Publish ekonomisk policy
        uses: olillin/publish-docs-action@main
        with:
          path: ./pdfs/ekonomisk_policy.pdf
          category_stub: policies
          document_stub: financial-policy

      - name: Publish miljöpolicy
        uses: olillin/publish-docs-action@main
        with:
          path: ./pdfs/miljopolicy.pdf
          category_stub: policies
          document_stub: environmental-policy

      - name: Publish kommunikationspolicy
        uses: olillin/publish-docs-action@main
        with:
          path: ./pdfs/kommunikationspolicy.pdf
          category_stub: policies
          document_stub: communication-policy
