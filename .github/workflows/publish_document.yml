name: Build and Publish PDF

on:
  workflow_call:
    inputs:
      document_name:
        required: true
        type: string
      latex_build_entry:
        required: true
        type: string
      build_working_directory:
        required: false
        type: string
      category_slug:
        required: true
        type: string
      document_slug:
        required: true
        type: string

jobs:
  build:
    uses: ./.github/workflows/build_document.yml
    with:
      document_name: ${{ inputs.document_name }}
      latex_build_entry: ${{ inputs.latex_build_entry }}
      build_working_directory: ${{ inputs.build_working_directory }}

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Get PDF
        uses: actions/download-artifact@v4
        with:
          path: ./pdfs

      - name: Find PDF in directory
        run: mv "$(find ./pdfs/**/*.pdf -type f | head -1)" doc.pdf

      - name: Install pdfgrep
        run: sudo apt install -y pdfgrep

      - name: Find revised at date
        id: revised_at
        # Note: Revision dates use en-dashes
        run: echo "::set-output name=revised_at::$(pdfgrep -iPe '(?<=Reviderad: )\d{4}[–-]\d{2}[–-]\d{2}' doc.pdf -o| sed 's/–/-/g')"

      - name: Publish PDF
        uses: olillin/publish-docs-action@v1
        with:
          path: ./doc.pdf
          category_slug: ${{ inputs.category_slug }}
          document_slug: ${{ inputs.document_slug }}
          revised_at: ${{ steps.revised_at.outputs.revised_at }}
          ignore_conflicts: true
